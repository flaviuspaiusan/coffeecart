<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ecran Barista | Impact Coffee</title>
    <link rel="icon" type="image/png" href="/assets/brand-logo.png?v=2">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
    <link rel="stylesheet" href="/bar-style.css">
</head>
<body class="theme-barista">
    <div class="app-layout">
        <!-- HEADER PRINCIPAL -->
        <header class="app-header">
            <a href="/barista.html" class="brand-section">
                <img src="/assets/brand-logo.png" alt="Logo Impact Coffee" class="brand-logo-img">
                <div class="brand-text">
                    <h1>IMPACT COFFEE</h1>
                    <span>Ecran Barista</span>
                </div>
            </a>

            <!-- NAVIGARE ÎNTRE PAGINI (FĂRĂ EMOTICOANE) -->
            <nav class="header-nav">
                <a href="/pos.html" class="nav-tab-btn">
                    <span>Preluare Comenzi</span>
                </a>
                <a href="/barista.html" class="nav-tab-btn active">
                    <span>Ecran Barista</span>
                </a>
                <a href="/statistici.html" class="nav-tab-btn">
                    <span>Statistici</span>
                </a>
            </nav>

            <!-- STATISTICI RAPIDE & CONTROALE BAR -->
            <div class="header-actions">
                <button type="button" class="tool-icon-btn" id="btn-toggle-sound" title="Comutare sunet">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                    </svg>
                </button>
                <button type="button" class="tool-icon-btn" id="btn-fullscreen" title="Ecran complet">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                    </svg>
                </button>
                <button type="button" class="stats-pill-btn" id="btn-open-stats" title="Vezi statistici băuturi">
                    <span>Total băuturi:</span>
                    <strong id="stat-total-cups">0</strong>
                </button>
            </div>
        </header>

        <!-- CONTAINER BARISTA -->
        <main class="barista-container">
            <!-- BARA DE CONTOARE ȘI FILTRE -->
            <div class="barista-subbar">
                <div class="barista-counters">
                    <div class="counter-chip pending">
                        <div class="counter-num" id="stat-pending-count">0</div>
                        <div class="counter-label">În așteptare</div>
                    </div>
                    <div class="counter-chip completed">
                        <div class="counter-num" id="stat-completed-count">0</div>
                        <div class="counter-label">Finalizate</div>
                    </div>
                </div>

                <div class="barista-tabs">
                    <button type="button" class="bar-tab-btn active" id="tab-pending">
                        <span>În lucru</span>
                        <span style="font-size: 0.85rem; background: var(--navy-dark); padding: 0.15rem 0.5rem; border-radius: 12px; color: var(--gold-light);" id="count-pending-badge">0</span>
                    </button>
                    <button type="button" class="bar-tab-btn" id="tab-completed">
                        <span>Istoric Finalizate</span>
                        <span style="font-size: 0.85rem; background: var(--navy-dark); padding: 0.15rem 0.5rem; border-radius: 12px; color: #4ade80;" id="count-completed-badge">0</span>
                    </button>
                </div>

                <div class="barista-controls">
                    <button type="button" class="btn-secondary" id="btn-clear-completed" style="display: none; font-size: 0.82rem;">
                        Curăță istoricul finalizat
                    </button>
                </div>
            </div>

            <!-- GRILA DE COMENZI ACTIVE (KDS) -->
            <section aria-label="Comenzi de cafea">
                <div class="orders-grid" id="orders-grid">
                    <!-- Cardurile de comenzi sunt generate dinamic din JS -->
                </div>
            </section>
        </main>

        <!-- MODAL STATISTICI -->
        <div class="modal-overlay" id="stats-modal">
            <div class="modal-content" style="background: var(--navy-surface); color: var(--white); border-color: var(--gold-primary);">
                <button type="button" class="modal-close-btn" id="btn-close-stats" style="color: var(--white); background: rgba(255,255,255,0.1);" aria-label="Închide">✕</button>

                <div class="stats-header-banner" style="border-bottom-color: var(--navy-border);">
                    <div>
                        <h2 style="font-family: var(--font-heading); font-size: 1.6rem; color: var(--white);">
                            Sumar Băuturi Preparate
                        </h2>
                        <p style="color: var(--text-light-muted); font-size: 0.9rem; margin-top: 0.2rem;">
                            Evidență în timp real pentru fiecare sortiment
                        </p>
                    </div>

                    <div class="stats-total-box" style="background: var(--navy-dark);">
                        <div class="stats-total-num" id="stats-total-display">0</div>
                        <div class="stats-total-meta">
                            <h4>TOTAL BĂUTURI</h4>
                            <p>preparate la bar</p>
                        </div>
                    </div>
                </div>

                <!-- GRILA CU CELE 7 BĂUTURI -->
                <div class="drinks-stats-grid" id="stats-grid">
                    <!-- Populat din JS -->
                </div>

                <div class="report-actions">
                    <button type="button" class="btn-danger-outline" id="btn-reset-stats">
                        Resetează contor (Zi nouă)
                    </button>
                    <a href="/statistici.html" class="btn-secondary" style="color: var(--gold-light); border-color: var(--gold-primary);">
                        Deschide pagina completă de statistici
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/barista.js"></script>
</body>
</html>
